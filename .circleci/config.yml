
version: 2.1
jobs:
  build:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - run:
          name: Run tests
          command: pytest -v
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: docker build -t flask-student-app .
workflows:
  flask-workflow:
    jobs:
      - build

